name: YouYou Release

# Fork-only workflow: build the manager on every push to the `youyou` branch
# and publish the APKs as a GitHub Release so they are kept permanently.
# Kept in its own file so upstream merges never touch it.

on:
  push:
    branches: [ "youyou" ]
    paths:
      - '.github/workflows/youyou-release.yml'
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ksud.yml'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'
  workflow_dispatch:

concurrency:
  group: youyou-release
  cancel-in-progress: true

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  release:
    needs: build-manager
    if: github.ref == 'refs/heads/youyou'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download manager APKs
        uses: actions/download-artifact@v7
        with:
          pattern: manager*
          path: out

      - name: Collect APKs and version
        id: meta
        run: |
          mkdir -p release
          find out -name '*.apk' -exec cp {} release/ \;
          ls -l release
          # YouYouSU-Next_<versionName>_<versionCode>-release.apk
          APK=$(ls release/*.apk | grep -v spoofed | head -n1)
          BASE=$(basename "$APK" -release.apk)
          BASE=${BASE#YouYouSU-Next_}
          VERSION_CODE=${BASE##*_}
          VERSION_NAME=${BASE%_*}
          echo "tag=youyou-${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "name=YouYouSU-Next ${VERSION_NAME} (${VERSION_CODE})" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          body: |
            Automated build from `${{ github.ref_name }}` @ ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: release/*.apk
          make_latest: true
