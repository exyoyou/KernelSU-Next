name: YouYou Release

# Fork-only workflow (kept in its own file so upstream merges never touch it).
# - Push to `youyou`        -> pre-release  tagged youyou-<versionCode>
# - Push tag `youyou-vX.Y.Z` -> formal release "YouYouSU-Next vX.Y.Z" (latest)
#   (created by youyou-upstream-sync.yml when an upstream release merges cleanly)

on:
  push:
    branches: [ "youyou" ]
    tags: [ "youyou-v*" ]
    paths:
      - '.github/workflows/youyou-release.yml'
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ksud.yml'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'
  workflow_dispatch:

concurrency:
  group: youyou-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  release:
    needs: build-manager
    if: github.ref == 'refs/heads/youyou' || startsWith(github.ref, 'refs/tags/youyou-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download manager APKs
        uses: actions/download-artifact@v7
        with:
          pattern: manager*
          path: out

      - name: Collect APKs and version
        id: meta
        run: |
          mkdir -p release
          find out -name '*.apk' -exec cp {} release/ \;
          ls -l release
          # YouYouSU-Next_<versionName>_<versionCode>-release.apk
          APK=$(ls release/*.apk | grep -v spoofed | head -n1)
          BASE=$(basename "$APK" -release.apk)
          BASE=${BASE#YouYouSU-Next_}
          VERSION_CODE=${BASE##*_}
          VERSION_NAME=${BASE%_*}
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "name=YouYouSU-Next ${TAG#youyou-} (${VERSION_CODE})" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=youyou-${VERSION_CODE}" >> "$GITHUB_OUTPUT"
            echo "name=YouYouSU-Next ${VERSION_NAME} (${VERSION_CODE})" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.latest }}
          body: |
            Automated build from `${{ github.ref_name }}` @ ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: release/*.apk
